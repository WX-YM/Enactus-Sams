# The Enactus SAMS site behind nginx. Copy into /etc/nginx/sites-available/,
# replace the three paths and the server name, and reload.
#
# nginx terminates TLS and proxies everything to the backend on loopback. The
# backend serves the pages and the API itself; nginx additionally serves the
# media files the backend authorises with X-Accel-Redirect, from a location
# that is `internal` — a client can never request /protected_storage/ itself.

upstream enactus_backend {
    server 127.0.0.1:8085;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name enactussams.org www.enactussams.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name enactussams.org www.enactussams.org;

    ssl_certificate     /etc/letsencrypt/live/enactussams.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enactussams.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    # The largest image upload the backend accepts (anvil images::kMaxBytes)
    # plus headroom; the backend enforces the real limit.
    client_max_body_size 26m;

    # STORAGE_ROOT, exactly as the backend is configured. `internal`: reachable
    # only through the backend's X-Accel-Redirect, never by a client.
    location /protected_storage/ {
        internal;
        alias /var/lib/enactus/storage/;
        # The backend chose the type and the caching; nginx adds nothing.
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    location / {
        proxy_pass http://enactus_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The backend trusts this header only from TRUSTED_PROXIES (127.0.0.1/32).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
